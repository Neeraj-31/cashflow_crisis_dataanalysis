[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ewm-cashflow"
version = "0.1.0"
description = "Early Warning of Cash-Flow Crises: A Layered, Self-Referential Monitoring Framework"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas>=2.0",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
